<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maths Quest — Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:system-ui;text-align:center}h1{margin:12px 0 4px;font-size:clamp(24px,6vw,38px)}p{margin:5px 8px 12px;font-size:14px}#game{width:min(100%,960px);margin:auto}#game canvas{display:block;width:100%;height:auto;touch-action:none}.controls{display:flex;align-items:center;justify-content:space-between;max-width:480px;margin:10px auto 22px;padding:0 15px;gap:18px}.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,51px);gap:3px}.controls button{border:2px solid #b9d5c6;border-radius:12px;background:#245b4b;color:white;font-size:23px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}.pad button:nth-child(1){grid-column:2;grid-row:1}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:3;grid-row:2}.pad button:nth-child(4){grid-column:2;grid-row:3}.action{height:76px;min-width:96px;padding:8px;font-size:17px!important;background:#98672b!important}@media(min-width:850px){.controls{opacity:.8}}
</style></head><body><h1>Maths Quest</h1><p>Monde 1 — L'Académie des Mathématiques • Prototype en développement</p><div id="game"></div><div class="controls"><div class="pad"><button data-dir="up" aria-label="Haut">▲</button><button data-dir="left" aria-label="Gauche">◀</button><button data-dir="right" aria-label="Droite">▶</button><button data-dir="down" aria-label="Bas">▼</button></div><button class="action" id="interact">ENTRER</button></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="src/game.js"></script></body></html>
