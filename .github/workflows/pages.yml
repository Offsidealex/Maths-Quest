name: Maths Quest — site public et version test

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maths-quest-pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la version publique
        uses: actions/checkout@v4
        with:
          ref: main
          path: public
          persist-credentials: false
      - name: Récupérer la version de test
        uses: actions/checkout@v4
        with:
          ref: test
          path: preview
          persist-credentials: false
      - name: Vérifier le jeu public
        run: node development/test-game-v0336.cjs
        working-directory: public
      - name: Vérifier le jeu de test
        run: node development/test-game-v0336.cjs
        working-directory: preview
      - name: Préparer les deux versions
        run: |
          mkdir -p site/test
          # Les fichiers de développement ne sont pas nécessaires pour jouer.
          for folder in public preview; do
            test -f "$folder/index.html"
          done
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/test/' --exclude='/development/' --exclude='/docs/' --exclude='/database/' --exclude='/sources/' --exclude='/work/' public/ site/
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/test/' --exclude='/development/' --exclude='/docs/' --exclude='/database/' --exclude='/sources/' --exclude='/work/' preview/ site/test/
          touch site/.nojekyll
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publier l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: Déployer les deux versions
        id: deployment
        uses: actions/deploy-pages@v4
